name: domainscanner-dev

services:
  postgres:
    image: postgres:18-alpine
    
    restart: unless-stopped
    
    volumes:
      - postgres-data-dev:/var/lib/postgresql
    
    env_file:
      - .env.dev
    
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    
    networks:
      - domainscanner-dev

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy
    
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    
    volumes:
      - redis-data-dev:/data
    
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    networks:
      - domainscanner-dev

  aspnet-api:
    image: api-dev
    
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Debud
    
    restart: unless-stopped
    
    env_file:
      - .env.dev
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/domainscanner.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD}

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:6379

      RedisCacheOptions__InstanceName: ${REDIS_INSTANCE_NAME}
      RedisCacheOptions__DefaultExpirationMinutes: ${REDIS_DEFAULT_EXPIRATION_MINUTES}

      JwtOptions__SecretKey: ${JWT_SECRETKEY}
      
      DataProtection__KeysPath: /var/lib/domainscanner/keys
      
      ReverseProxy__Enabled: "false"
        
      LoginAccountKeyOptions__HmacSecret: ${LOGIN_ACCOUNT_KEY_SECRET}
    
    volumes:
      - data-protection-dev:/var/lib/domainscanner/keys
      - "${HTTPS_CERT_PATH}:/https/domainscanner.pfx:ro"
    
    ports:
      - "127.0.0.1:${API_PORT}:8080"
      - "127.0.0.1:${API_HTTPS_PORT}:8443"
    healthcheck:
      test: >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
        head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
   
    networks:
      - domainscanner-dev

  hangfire-worker:
    image: worker-dev
   
    restart: unless-stopped
    
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Worker/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    environment:
      DOTNET_ENVIRONMENT: Development

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:6379

      DomainChecksWorker__RecurringJobId: ${RECURRING_JOB_ID}
      DomainChecksWorker__CronExpression: ${WORKER_CRON_EXPRESSION}
      DomainChecksWorker__QueueName: ${WORKER_QUEUE_NAME}
      DomainChecksWorker__BatchSize: ${WORKER_BATCH_SIZE}
    networks:
      - domainscanner-dev

volumes:
  postgres-data-dev:
    name: domainscanner-postgres-data-dev

  redis-data-dev:
    name: domainscanner-redis-data-dev
    
  data-protection-dev:
    name: domainnscanner-data-protection-dev

networks:
  domainscanner-dev:
    name: domainscanner-dev
    driver: bridge
