services:
  database:
    image: postgres:latest
    container_name: database
    environment:
      - POSTGRES_DB=scannerdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/domains-db:/var/lib/postgresql
    ports:
      - "5432:5432"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scannerdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      
  api:
    image: api
    build:
      context: .
      dockerfile: backend/src/DomainScanner.Api/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      ConnectionString__Default: Host=database;Port=5432;Database=scannerdb;Username=postgres;password=postgres
    ports:
      - "8080:8080"
    
  worker:
    image: worker
    build:
      context: .
      dockerfile: backend/src/DomainScanner.Worker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=scannerdb;Username=postgres;password=postgres
      DomainChecksWorker__CronExpression: "*/5 * * * *"
      DomainChecksWorker__QueueName: domain-checks
      DomainChecksWorker__BatchSize: 30