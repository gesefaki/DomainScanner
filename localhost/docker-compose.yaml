services:
  postgres-database:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend-domainscanner
      
  aspnet-api:
    image: api
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-database:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};password=${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-domainscanner
    
  hangfire-worker:
    image: worker
    restart: unless-stopped
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Worker/Dockerfile
    depends_on:
      postgres-database:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};password=${POSTGRES_PASSWORD}
      DomainChecksWorker__RecurringJobId: ${RECURRING_JOB_ID}
      DomainChecksWorker__CronExpression: ${WORKER_CRON_EXPRESSION}
      DomainChecksWorker__QueueName: ${WORKER_QUEUE_NAME}
      DomainChecksWorker__BatchSize: ${WORKER_BATCH_SIZE}
    networks:
      - backend-domainscanner

volumes:
  postgres-data:
    driver: local
    name: domains-postgres-data
  

networks:
  backend-domainscanner:
    driver: bridge