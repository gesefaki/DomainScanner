name: domainscanner-prod

services:
  nginx:
    image: nginx:alpine
    
    restart: unless-stopped
    
    depends_on:
      aspnet-api:
        condition: service_healthy
        
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
        
    networks:
      edge:
        ipv4_address: ${TRUSTED_PROXY_ADDRESS}
  
  postgres:
    image: postgres:18-alpine
    
    restart: unless-stopped
    
    volumes:
      - postgres-data:/var/lib/postgresql
    
    env_file:
      - .env
    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    
    networks:
      - postgres-net

  redis:
    image: redis:8-alpine
    
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy
  
    expose:
      - "6379"
    
    volumes:
      - redis-data:/data
  
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
      
    networks:
      - redis-net

  aspnet-api:
    image: api
    
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Api/Dockerfile
      
    restart: unless-stopped
    
    env_file:
      - .env
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    environment:
      ASPNETCORE_URLS: "http://+:8080;"

      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:6379
      RedisCacheOptions__InstanceName: ${REDIS_INSTANCE_NAME}
      RedisCacheOptions__DefaultExpirationMinutes: ${REDIS_DEFAULT_EXPIRATION_MINUTES}
      JwtOptions__SecretKey: ${JWT_SECRETKEY}
      DataProtection__KeysPath: /var/lib/domainscanner/keys
      
      ReverseProxy__Enabled: ${ENABLE_TRUSTED_PROXY}
      ReverseProxy__TrustedProxy: ${TRUSTED_PROXY_ADDRESS}
      ReverseProxy__ForwardLimit: ${TRUSTED_PROXY_FORWARD_LIMIT}
      
      LoginAccountKeyOptions__HmacSecret: ${LOGIN_ACCOUNT_KEY_SECRET}
      
    volumes:
      - data-protection-prod:/var/lib/domainscanner/keys
    
    expose:
      - "8080"
    
    healthcheck:
      test: >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
        head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    
    networks:
      - edge
      - postgres-net
      - redis-net

  hangfire-worker:
    image: domainscanner-worker
    
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Worker/Dockerfile
      
    restart: unless-stopped
    
    env_file:
      - .env
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    environment:
      DOTNET_ENVIRONMENT: Production
      
      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      
      ConnectionStrings__RedisConnection: redis:6379
      
      DomainChecksWorker__RecurringJobId: ${RECURRING_JOB_ID}
      DomainChecksWorker__CronExpression: ${WORKER_CRON_EXPRESSION}
      DomainChecksWorker__QueueName: ${WORKER_QUEUE_NAME}
      DomainChecksWorker__BatchSize: ${WORKER_BATCH_SIZE}
    
    networks:
      - postgres-net
      - redis-net
      # A separate network for the worker's outgoing HTTP requests.
      - worker-egress

volumes:
  postgres-data:
    driver: local
    name: domains-postgres-data
 
  redis-data:
 
  data-protection-prod:
    name: domainscanner-data-protection-rpd

networks:
  # nginx and API. The network also provides an API with outbound Internet access,
  # which is required for domain scanning.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          
  # Isolated network for API/worker/Postgres
  postgres-net:
    driver: bridge
    internal: true
    
  # Isolated network for API/worker/Redis
  redis-net:
    driver: bridge
    internal: true
    
  # Outbound Internet access only for the worker.
  worker-egress:
    driver: bridge
    
