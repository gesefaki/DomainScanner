version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend-domainscanner

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend-domainscanner

  aspnet-api:
    image: api
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:${REDIS_PORT}
      RedisCacheOptions__InstanceName: ${REDIS_INSTANCE_NAME}
      RedisCacheOptions__DefaultExpirationMinutes: ${REDIS_DEFAULT_EXPIRATION_MINUTES}
    ports:
      - "${API_PORT}:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-domainscanner

  hangfire-worker:
    image: worker
    restart: unless-stopped
    build:
      context: ../.
      dockerfile: backend/src/DomainScanner.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};password=${POSTGRES_PASSWORD}
      ConnectionStrings__RedisConnection: redis:${REDIS_PORT}
      DomainChecksWorker__RecurringJobId: ${RECURRING_JOB_ID}
      DomainChecksWorker__CronExpression: ${WORKER_CRON_EXPRESSION}
      DomainChecksWorker__QueueName: ${WORKER_QUEUE_NAME}
      DomainChecksWorker__BatchSize: ${WORKER_BATCH_SIZE}
    networks:
      - backend-domainscanner

volumes:
  postgres-data:
    driver: local
    name: domains-postgres-data
  redis-data:

networks:
  backend-domainscanner:
    driver: bridge
